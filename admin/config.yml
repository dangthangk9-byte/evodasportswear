# Cấu hình Decap CMS cho EVODA – truy cập tại /admin/
backend:
  name: github
  repo: dangthangk9-byte/evodasportswear
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

locale: vi
media_folder: assets/images/khac        # nơi lưu ảnh upload mới
public_folder: /assets/images/khac      # đường dẫn ghi vào JSON
site_url: https://evodasports.netlify.app

collections:
  - name: products
    label: Sản phẩm
    files:
      - name: products
        label: Danh sách sản phẩm
        file: data/products.json
        format: json
        fields:
          - label: Sản phẩm
            name: products
            widget: list
            label_singular: sản phẩm
            summary: "{{fields.shortName}} – {{fields.price}}đ"
            fields:
              - { label: Mã, name: id, widget: string }
              - { label: "Slug (đường dẫn – KHÔNG đổi)", name: slug, widget: string }
              - { label: Tên đầy đủ, name: name, widget: text }
              - { label: Tên ngắn, name: shortName, widget: string }
              - { label: Tên bộ sưu tập, name: collection, widget: string }
              - { label: "Slug bộ sưu tập (KHÔNG đổi)", name: collectionSlug, widget: string }
              - { label: Giá (VNĐ, chỉ nhập số), name: price, widget: number, value_type: int, min: 0 }
              - { label: Nhãn (NEW / BESTSELLER / SIGNATURE, để trống nếu không có), name: label, widget: string, required: false }
              - { label: Là hàng mới, name: isNew, widget: boolean, default: false }
              - { label: Là bán chạy, name: isBestseller, widget: boolean, default: false }
              - label: Màu sắc
                name: colors
                widget: list
                field: { label: Màu, name: color, widget: string }
              - label: Kích cỡ
                name: sizes
                widget: list
                field: { label: Size, name: size, widget: string }
              - label: Ảnh sản phẩm (ảnh đầu tiên là ảnh đại diện)
                name: images
                widget: list
                field: { label: Ảnh, name: image, widget: image }
              - label: Ảnh theo màu
                name: colorImages
                widget: list
                required: false
                fields:
                  - { label: Tên màu (trùng với mục Màu sắc), name: color, widget: string }
                  - label: Ảnh
                    name: images
                    widget: list
                    field: { label: Ảnh, name: image, widget: image }
              - { label: Mô tả, name: description, widget: text }
              - label: Đặc điểm nổi bật
                name: features
                widget: list
                field: { label: Đặc điểm, name: feature, widget: text }
              - { label: Chất liệu, name: material, widget: text }
              - { label: Phong cách, name: style, widget: text }
              - label: Phù hợp cho
                name: suitableFor
                widget: list
                required: false
                field: { label: Môn / hoạt động, name: item, widget: string }
              - { label: Link TikTok Shop, name: tiktokLink, widget: string }

  - name: collections
    label: Bộ sưu tập
    files:
      - name: collections
        label: Danh sách bộ sưu tập
        file: data/collections.json
        format: json
        fields:
          - label: Bộ sưu tập
            name: collections
            widget: list
            label_singular: bộ sưu tập
            summary: "{{fields.name}}"
            fields:
              - { label: "Slug (KHÔNG đổi)", name: slug, widget: string }
              - { label: Mã, name: code, widget: string }
              - { label: Tên, name: name, widget: string }
              - { label: Ảnh poster (ảnh đứng ở trang danh sách), name: poster, widget: image }
              - { label: Ảnh banner (ảnh ngang đầu trang), name: banner, widget: image }
              - { label: Mô tả ngắn, name: shortDescription, widget: text }
              - { label: Giới thiệu, name: intro, widget: text }
              - label: Thiết kế trong bộ sưu tập
                name: pieces
                widget: list
                fields:
                  - { label: Tên, name: name, widget: string }
                  - { label: Mô tả, name: desc, widget: text }
                  - label: Điểm nổi bật
                    name: features
                    widget: list
                    field: { label: Điểm, name: feature, widget: text }
                  - { label: Slug sản phẩm liên kết, name: productSlug, widget: string, required: false }
              - { label: Chất liệu (mỗi ý một câu, kết thúc bằng dấu chấm), name: material, widget: text }
              - label: Màu sắc
                name: colors
                widget: list
                fields:
                  - { label: Tên màu, name: name, widget: string }
                  - { label: Mô tả, name: desc, widget: string }
              - label: Phù hợp cho
                name: suitableFor
                widget: list
                field: { label: Hoạt động, name: item, widget: string }
              - label: Slug các sản phẩm trong bộ sưu tập
                name: productSlugs
                widget: list
                field: { label: Slug, name: slug, widget: string }

  - name: news
    label: Tin tức
    files:
      - name: news
        label: Danh sách bài viết
        file: data/news.json
        format: json
        fields:
          - label: Bài viết
            name: news
            widget: list
            label_singular: bài viết
            summary: "{{fields.displayDate}} – {{fields.title}}"
            fields:
              - { label: Mã, name: id, widget: string }
              - { label: "Slug (KHÔNG đổi)", name: slug, widget: string }
              - { label: Tiêu đề, name: title, widget: string }
              - { label: Ngày (YYYY-MM-DD), name: date, widget: string }
              - { label: Ngày hiển thị (dd/mm/yyyy), name: displayDate, widget: string }
              - { label: Ảnh đại diện, name: image, widget: image }
              - { label: Mô tả ngắn, name: excerpt, widget: text }
              - { label: Nội dung bài viết (soạn như Word – dùng nút trên thanh công cụ), name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list], editor_components: [image] }
