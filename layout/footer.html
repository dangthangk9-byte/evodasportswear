<script>
  (function() {
    const reveals = document.querySelectorAll('.reveal-on-scroll');
    if ('IntersectionObserver' in window) {
      const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('is-revealed'); observer.unobserve(entry.target); } });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      reveals.forEach(el => revealObserver.observe(el));
    } else { reveals.forEach(el => el.classList.add('is-revealed')); }

    const header = document.getElementById('main-header');
    if (header) {
      const handleScroll = () => { if (window.scrollY > 20) { header.classList.add('shadow-sm'); } else { header.classList.remove('shadow-sm'); } };
      window.addEventListener('scroll', handleScroll, { passive: true });
      handleScroll();
    }
    
    // setActiveNav
    const currentPath = window.location.pathname;
    document.querySelectorAll('nav a').forEach(a => {
        if(currentPath.includes(a.getAttribute('href')) && a.getAttribute('href') !== '/') {
            a.classList.replace('text-[#595959]', 'text-[#000000]');
            a.classList.add('border-b-2', 'border-primary');
        } else if (currentPath === '/' && a.getAttribute('href') === '/') {
            a.classList.replace('text-[#595959]', 'text-[#000000]');
            a.classList.add('border-b-2', 'border-primary');
        }
    });
  })();
</script>
