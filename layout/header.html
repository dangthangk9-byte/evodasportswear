</button>

<div id="mobile-menu" class="fixed inset-y-0 right-0 w-full max-w-sm bg-white z-[60] transform translate-x-full transition-transform duration-300 xl:hidden flex flex-col shadow-2xl">
<div class="h-20 px-margin-mobile flex items-center justify-between border-b border-outline-variant">
<span class="font-label-nav font-bold tracking-wider text-lg">MENU</span>
<button aria-label="Close Menu" id="mobile-menu-close" class="text-on-surface hover:text-primary flex items-center justify-center p-1.5">
<span class="material-symbols-outlined">close</span>
</button>
</div>

</nav>
</div>
<!-- Mobile menu overlay backdrop -->
<div id="mobile-menu-backdrop" class="fixed inset-0 bg-black/50 z-[50] hidden opacity-0 transition-opacity duration-300 xl:hidden backdrop-blur-sm"></div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenuClose = document.getElementById('mobile-menu-close');
    const mobileMenu = document.getElementById('mobile-menu');
    const mobileMenuBackdrop = document.getElementById('mobile-menu-backdrop');
    
    function openMenu() {
      if(!mobileMenu) return;
      mobileMenu.classList.remove('translate-x-full');
      if(mobileMenuBackdrop) {
        mobileMenuBackdrop.classList.remove('hidden');
        setTimeout(() => mobileMenuBackdrop.classList.remove('opacity-0'), 10);
      }
      document.body.style.overflow = 'hidden';
    }
    
    function closeMenu() {
      if(!mobileMenu) return;
      mobileMenu.classList.add('translate-x-full');
      if(mobileMenuBackdrop) {
        mobileMenuBackdrop.classList.add('opacity-0');
        setTimeout(() => mobileMenuBackdrop.classList.add('hidden'), 300);
      }
      document.body.style.overflow = '';
    }
    
    if(mobileMenuBtn) mobileMenuBtn.addEventListener('click', openMenu);
    if(mobileMenuClose) mobileMenuClose.addEventListener('click', closeMenu);
    if(mobileMenuBackdrop) mobileMenuBackdrop.addEventListener('click', closeMenu);
  });
</script>
</header>
